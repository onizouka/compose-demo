services:
  web:
    build: .
    ports:
      - "8000:5000"
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  pythonapp:
    image: python:3.12-slim
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/usr/src/app:ro
      - ./netskope-ca.crt:/usr/local/share/ca-certificates/netskope-ca.crt:ro
    working_dir: /usr/src/app
    environment:
      PIP_CERT: /etc/ssl/certs/ca-certificates.crt
    command: >
      sh -c "update-ca-certificates &&
            pip install --no-cache-dir redis &&
            python main.py"
